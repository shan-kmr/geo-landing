<body>
  <div id="root"></div>
  <script>/* pageview + dwell beacon → Janus usage (privacy-light: coarse geo, hashed IP) */
  (function(){var A="https://janus-courier.fly.dev/courier",t0=Date.now(),vid=null;
  fetch(A+"/px?p=landing",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){vid=d&&d.vid;}).catch(function(){});
  function dw(){if(vid==null)return;try{navigator.sendBeacon(A+"/dwell",new Blob([JSON.stringify({vid:vid,s:(Date.now()-t0)/1000})],{type:"application/json"}));}catch(e){}}
  addEventListener("pagehide",dw);addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")dw();});})();</script>
