<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>janus — order</title>
<!-- order: the buyer surface. Address -> geocode -> a delivery job, then a live
     timeline that resolves stage by stage. The "anywhere here" card reads the
     Janus places stack (H3 res-9). Deterministic motion idiom from onetap.html
     (f01/eO/eIO/lerp). API base: ?api=… (defaults to the live Fly server). -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<style>
:root{
  --paper:#F6F4EF;--ink:#1A1815;--ink2:#4E4B45;--muted:#8C887E;--faint:#B4B0A4;
  --hair:#E0DDD4;--surface:#FFFFFF;--surface2:#F0EDE6;
  --accent:#1E3A8A;--accent-soft:rgba(30,58,138,.09);
  --ok:#1A7D4A;--flag:#CC2B1D;--purple:#8A5BB8;--wait:#B0771A;
  --map-bg:#EFECE3;--shadow:0 18px 44px rgba(22,24,26,.07);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#141210;--ink:#F2EFE8;--ink2:#C4BFB4;--muted:#8E897E;--faint:#5E5A51;
  --hair:#2C2921;--surface:#1C1A16;--surface2:#211E19;
  --accent:#7E9EDC;--accent-soft:rgba(126,158,220,.13);
  --ok:#5FB98A;--flag:#E2685A;--purple:#B492D8;--wait:#D2A24C;
  --map-bg:#211D16;--shadow:0 18px 44px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --paper:#141210;--ink:#F2EFE8;--ink2:#C4BFB4;--muted:#8E897E;--faint:#5E5A51;
  --hair:#2C2921;--surface:#1C1A16;--surface2:#211E19;
  --accent:#7E9EDC;--accent-soft:rgba(126,158,220,.13);
  --ok:#5FB98A;--flag:#E2685A;--purple:#B492D8;--wait:#D2A24C;
  --map-bg:#211D16;--shadow:0 18px 44px rgba(0,0,0,.35);
}
:root[data-theme="light"]{
  --paper:#F6F4EF;--ink:#1A1815;--ink2:#4E4B45;--muted:#8C887E;--faint:#B4B0A4;
  --hair:#E0DDD4;--surface:#FFFFFF;--surface2:#F0EDE6;
  --accent:#1E3A8A;--accent-soft:rgba(30,58,138,.09);
  --ok:#1A7D4A;--flag:#CC2B1D;--purple:#8A5BB8;--wait:#B0771A;--map-bg:#EFECE3;--shadow:0 18px 44px rgba(22,24,26,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:30px 18px 44px}
.eyebrow{font:600 10.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.frame{width:100%;max-width:940px;display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
@media (max-width:780px){.frame{grid-template-columns:1fr}}
.card{border:1px solid var(--hair);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.card h1{font:600 17px/1.3 var(--sans);letter-spacing:-.01em;margin:0 0 3px}
.pad{padding:18px 18px 16px}
.sub{font:13px/1.5 var(--sans);color:var(--muted);margin:0 0 14px}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font:14px/1 var(--sans);color:var(--ink);background:var(--paper);
  border:1px solid var(--hair);border-radius:7px;padding:11px 12px}
.field input:focus{outline:none;border-color:var(--accent)}
.btn{font:600 13px/1 var(--sans);border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:7px;padding:0 15px;cursor:pointer;white-space:nowrap;transition:filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--accent)}
.row2{display:flex;gap:8px;margin-top:8px;align-items:center}
.mini{font:500 12px/1 var(--sans);color:var(--muted);cursor:pointer;background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:3px}
#map{height:150px;border-top:1px solid var(--hair);background:var(--map-bg)}
.msg{font:500 12.5px/1.5 var(--sans);color:var(--flag);margin-top:8px;min-height:0}
/* timeline */
@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.tl{list-style:none;margin:0;padding:2px 0 0}
.tl li{display:grid;grid-template-columns:20px 1fr;gap:11px;padding:0 0 2px;position:relative;animation:riseIn .45s ease both}
.tl .rail{display:flex;flex-direction:column;align-items:center}
.tl .dot{width:11px;height:11px;border-radius:50%;background:var(--faint);margin-top:3px;flex:none;
  box-shadow:0 0 0 0 var(--accent-soft);transition:box-shadow .5s}
.tl li.on .dot{background:var(--accent)} .tl li.ok .dot{background:var(--ok)} .tl li.bad .dot{background:var(--flag)}
.tl li.pulse .dot{box-shadow:0 0 0 7px var(--accent-soft)}
.tl .line{width:2px;flex:1;background:var(--hair);margin:2px 0 -2px}
.tl li:last-child .line{display:none}
.tl .body{padding-bottom:14px}
.tl .st{font:600 13.5px/1.3 var(--sans);color:var(--ink)}
.tl .note{font:12.5px/1.4 var(--sans);color:var(--muted);margin-top:1px}
.chip{display:inline-block;font:600 9.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  border-radius:4px;padding:4px 7px;margin-top:6px;border:1px solid var(--ok);color:var(--ok)}
.chip.bad{border-color:var(--flag);color:var(--flag)} .chip.wait{border-color:var(--wait);color:var(--wait)}
.hero{display:flex;align-items:baseline;gap:8px;margin:2px 0 12px;font-variant-numeric:tabular-nums}
.hero .big{font:600 26px/1 var(--sans);letter-spacing:-.02em}
.hero .unit{font:500 13px/1 var(--sans);color:var(--muted)}
.receipt{border:1px solid var(--hair);border-radius:8px;background:var(--surface2);padding:12px 13px;margin-top:6px;opacity:0}
.receipt .rl{display:flex;justify-content:space-between;gap:10px;font:500 11.5px/1.7 var(--mono);color:var(--ink2)}
.receipt .rl b{color:var(--ink);font-weight:600}
.receipt .verify{margin-top:8px;font:600 11px/1 var(--mono);color:var(--accent);cursor:pointer;background:none;border:none;padding:0;text-decoration:underline;text-underline-offset:3px}
/* atlas card */
.atlas .pad{padding:15px 16px 14px}
.atlas h2{font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.atlas .where{font:600 14px/1.3 var(--sans);color:var(--ink);margin:0 0 12px;word-break:break-word}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-bottom:9px;animation:riseIn .5s ease both}
.stat .lbl{font:500 12px/1 var(--sans);color:var(--ink2)}
.stat .val{font:600 13px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.stat .bar{grid-column:1/3;height:3px;border-radius:2px;background:var(--hair);overflow:hidden}
.stat .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}
.atlas .foot{margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.atlas .caveat{font:italic 11px/1.4 var(--sans);color:var(--faint)}
.deep{font:600 11px/1 var(--mono);color:var(--accent);text-decoration:none}
.net{font:500 11px/1.5 var(--mono);color:var(--muted);margin-top:12px;display:flex;align-items:center;gap:7px}
.net .d{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.hidden{display:none}
</style>
</head>
<body>
<div class="eyebrow">janus · delivery</div>
<div class="frame">
  <!-- left: order + timeline -->
  <div class="card">
    <div class="pad" id="orderPane">
      <h1>Where should it go?</h1>
      <p class="sub">A real address. We geocode it, place the delivery, then show you what the driver's phone actually proves.</p>
      <div class="field">
        <input id="addr" placeholder="166 Crosby St, New York" autocomplete="off" spellcheck="false">
        <button class="btn" id="go">Request delivery</button>
      </div>
      <div class="row2"><button class="mini" id="useloc">use my location</button></div>
      <div class="msg" id="msg"></div>
    </div>
    <div id="map"></div>
    <div class="pad hidden" id="tlPane">
      <div class="hero"><span class="big" id="heroBig">—</span><span class="unit" id="heroUnit"></span></div>
      <ul class="tl" id="tl"></ul>
      <div class="receipt" id="receipt">
        <div class="rl"><span>receipt</span><b id="rId">—</b></div>
        <div class="rl"><span>signature</span><b id="rSig">—</b></div>
        <div class="rl"><span>verdict</span><b id="rVerdict">—</b></div>
        <button class="verify" id="rVerify">verify this receipt →</button>
      </div>
      <button class="mini" id="reset" style="margin-top:12px">place another order</button>
    </div>
  </div>
  <!-- right: the places stack -->
  <div class="card atlas" id="atlasCard" style="display:none">
    <div class="pad">
      <h2>anywhere here</h2>
      <p class="where" id="atlasWhere">—</p>
      <div id="stats"></div>
      <div class="foot">
        <span class="caveat" id="atlasCaveat"></span>
        <a class="deep" id="atlasDeep" href="#" target="_blank" rel="noopener">open in the Atlas →</a>
      </div>
      <div class="net" id="net"><span class="d"></span><span id="netTxt">checking network…</span></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var f01=function(t,a,b){return Math.max(0,Math.min(1,(t-a)/(b-a)))};
var eO=function(x){return 1-Math.pow(1-x,3)};
var lerp=function(a,b,k){return a+(b-a)*k};
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var $=function(id){return document.getElementById(id)};

var Q=new URLSearchParams(location.search);
var API=(Q.get("api")||"https://janus-courier.fly.dev/courier").replace(/\/$/,"");
var ATLAS_BASE="https://huggingface.co/datasets/skay97/curbai-tiles/resolve/main/chunks/9";
var ATLAS_SITE="https://shan-kmr.github.io/geo-landing/atlas/";
var LAYERS=[
  {k:"building_count",n:"buildings",cap:400},
  {k:"poi_count",n:"places",cap:120},
  {k:"road_count",n:"roads",cap:60},
  {k:"wt_visit_count",n:"weighted visits",cap:3000},
  {k:"nightlight_2021",n:"nightlight",cap:100},
  {k:"kontur_population",n:"population",cap:20000,modeled:true}
];

/* ---- tiny map preview ---- */
var map=new maplibregl.Map({container:"map",attributionControl:false,
  style:{version:8,sources:{c:{type:"raster",tiles:["https://a.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png"],tileSize:256}},layers:[{id:"c",type:"raster",source:"c"}]},
  center:[-73.996,40.7246],zoom:13,interactive:false});
var pin=null;
function setPin(lng,lat){
  if(!pin){var el=document.createElement("div");el.style.cssText="width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35)";pin=new maplibregl.Marker({element:el});}
  pin.setLngLat([lng,lat]).addTo(map); map.easeTo({center:[lng,lat],zoom:15,duration:600});
}

/* ---- the "anywhere here" atlas read ---- */
function num(v){ if(v>=1000) return (v/1000).toFixed(v>=10000?0:1)+"k"; return Math.round(v).toString(); }
function animBar(el,to){ var s=null; function fr(ts){ if(s===null)s=ts; var k=reduce?1:eO(f01((ts-s)/1000,0,.7)); el.style.width=(to*k*100).toFixed(1)+"%"; if(k<1)requestAnimationFrame(fr);} requestAnimationFrame(fr); }
function fadeUp(el,delay){ el.style.transition="opacity .5s, transform .5s"; el.style.transform="translateY(5px)"; setTimeout(function(){el.style.opacity=1;el.style.transform="none";}, reduce?0:delay); }

async function atlasFor(lat,lng){
  var card=$("atlasCard"), where=$("atlasWhere"), caveat=$("atlasCaveat"), stats=$("stats");
  card.style.display=""; stats.innerHTML=""; caveat.textContent="";
  var cell, parent;
  try{ cell=h3.latLngToCell(lat,lng,9); parent=h3.cellToParent(cell,5); }
  catch(e){ where.textContent="—"; caveat.textContent="could not resolve this location"; return; }
  where.textContent="reading cell "+cell.slice(0,7)+"…";
  $("atlasDeep").href=ATLAS_SITE+"?h="+cell;
  var data;
  try{
    var r=await fetch(ATLAS_BASE+"/"+parent+".json",{cache:"force-cache"});
    if(!r.ok) throw 0; data=await r.json();
  }catch(e){ where.textContent="outside atlas coverage"; caveat.textContent="the res-9 grid covers the NYC region"; return; }
  var idx=data.h3.indexOf(cell);
  if(idx<0){ where.textContent="outside atlas coverage"; caveat.textContent="no cell here in the res-9 grid"; return; }
  where.textContent="H3 cell "+cell.slice(0,9)+" · res 9";
  LAYERS.forEach(function(L,i){
    var raw=(data.vals[L.k]||[])[idx]; if(raw==null) return;
    var row=document.createElement("div"); row.className="stat";
    row.innerHTML='<span class="lbl">'+L.n+(L.modeled?' <span style="color:var(--faint)">· modeled</span>':'')+'</span>'
      +'<span class="val">'+num(raw)+'</span><span class="bar"><i></i></span>';
    row.style.animationDelay=(i*0.08)+"s";
    stats.appendChild(row);
    animBar(row.querySelector("i"), Math.max(.03,Math.min(1,raw/L.cap)));
  });
  caveat.textContent="janus places stack";
}

/* ---- geocode + preview ---- */
var lastFix=null;
async function geocode(){
  var a=$("addr").value.trim(); if(!a) return null;
  $("msg").textContent="";
  try{
    var r=await fetch(API+"/geocode",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({address:a})});
    if(r.status===429){ $("msg").textContent="geocoder is busy — try again in a second"; return null; }
    if(!r.ok){ $("msg").textContent="couldn't find that address"; return null; }
    var d=await r.json(); lastFix={lat:d.lat,lng:d.lng,display:d.display_name};
    setPin(d.lng,d.lat); atlasFor(d.lat,d.lng); return lastFix;
  }catch(e){ $("msg").textContent="network error reaching the server"; return null; }
}
var gt=null;
$("addr").addEventListener("input",function(){ clearTimeout(gt); gt=setTimeout(geocode,650); });
$("useloc").addEventListener("click",function(){
  if(!navigator.geolocation){ $("msg").textContent="geolocation is off"; return; }
  navigator.geolocation.getCurrentPosition(function(p){
    lastFix={lat:p.coords.latitude,lng:p.coords.longitude,display:"Current location"};
    $("addr").value="Current location"; setPin(lastFix.lng,lastFix.lat); atlasFor(lastFix.lat,lastFix.lng);
  },function(){ $("msg").textContent="location permission denied"; });
});

/* ---- place the order ---- */
var orderId=localStorage.getItem("janus_order");
$("go").addEventListener("click",placeOrder);
async function placeOrder(){
  var fix=lastFix||await geocode(); if(!fix) return;
  $("go").disabled=true; $("go").textContent="placing…";
  try{
    var r=await fetch(API+"/order",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({address:fix.display,lat:fix.lat,lng:fix.lng})});
    var d=await r.json();
    if(!d.order_id) throw 0;
    orderId=d.order_id; localStorage.setItem("janus_order",orderId);
    enterTimeline();
  }catch(e){ $("msg").textContent="couldn't place the order"; $("go").disabled=false; $("go").textContent="Request delivery"; }
}
function enterTimeline(){ $("orderPane").classList.add("hidden"); $("tlPane").classList.remove("hidden"); poll(); }
$("reset").addEventListener("click",function(){ localStorage.removeItem("janus_order"); location.href=location.pathname+location.search; });

/* ---- the live timeline ---- */
var STAGES={awaiting_driver:"Waiting for a driver",assigned:"Driver assigned",en_route:"On the way",
  at_dropoff:"At your door",arrived:"Driver reported arrival",delivered:"Delivered"};
var seen={}, distShown=0;
function chipFor(verified){ return verified===true?'<span class="chip">verified</span>':verified===false?'<span class="chip bad">unverified</span>':''; }
function countTo(el,target,unit){ // eased number counter (tabular-nums)
  var from=distShown, s=null;
  function fr(ts){ if(s===null)s=ts; var k=reduce?1:eO(f01((ts-s)/1000,0,.5)); var v=Math.round(lerp(from,target,k)); el.textContent=v; distShown=v; if(k<1)requestAnimationFrame(fr);} requestAnimationFrame(fr);
}
async function poll(){
  if(!orderId) return;
  try{
    var r=await fetch(API+"/order/"+orderId,{cache:"no-store"});
    if(r.status===404){ localStorage.removeItem("janus_order"); location.href=location.pathname+location.search; return; }
    var o=await r.json(); render(o);
  }catch(e){}
  setTimeout(poll,1500);
}
function render(o){
  // hero: live distance while en route, else the current stage word
  if((o.stage==="en_route"||o.stage==="at_dropoff")&&o.dist_m!=null){
    $("heroBig").classList.remove("hidden"); countTo($("heroBig"),o.dist_m); $("heroUnit").textContent="m from your door";
  }else{
    var last=o.timeline[o.timeline.length-1]||{};
    $("heroBig").textContent=STAGES[o.stage]||o.stage; $("heroUnit").textContent="";
  }
  // stream timeline rows
  var tl=$("tl");
  o.timeline.forEach(function(e,i){
    var key=i+":"+e.stage+":"+e.note;
    if(seen[key]) return; seen[key]=true;
    var li=document.createElement("li");
    var cls=e.verified===true?"ok":e.verified===false?"bad":"on";
    li.className=cls;
    li.innerHTML='<span class="rail"><span class="dot"></span><span class="line"></span></span>'
      +'<span class="body"><span class="st">'+(STAGES[e.stage]||e.stage)+'</span>'
      +'<span class="note">'+e.note+'</span>'+chipFor(e.verified)+'</span>';
    tl.appendChild(li);
    // CSS riseIn animates the entrance (compositor-driven, survives a backgrounded tab);
    // pulse the freshest dot once for emphasis
    li.classList.add("pulse"); setTimeout(function(){li.classList.remove("pulse");},700);
  });
  // receipt
  if(o.receipt){
    var R=$("receipt"); if(R.style.opacity!=1){ $("rId").textContent=o.receipt.id; $("rSig").textContent=o.receipt.sig.slice(0,16)+"…";
      $("rVerdict").textContent=(o.verified?"verified":"unverified")+" · "+(o.receipt.score!=null?o.receipt.score:"—");
      $("receipt").style.transition="opacity .6s"; R.style.opacity=1; window._rcpt=o.receipt; }
  }
}
$("rVerify").addEventListener("click",async function(){
  if(!window._rcpt) return; var b=$("rVerify"); b.textContent="checking…"; b.style.color="var(--accent)";
  try{
    var r=await fetch(API.replace(/\/courier$/,"")+"/mcp",{method:"POST",headers:{"content-type":"application/json","accept":"application/json, text/event-stream"},
      body:JSON.stringify({jsonrpc:"2.0",id:1,method:"tools/call",params:{name:"verify_receipt",arguments:{receipt:window._rcpt}}})});
    var j=await r.json();                          // the tool result is an escaped JSON string in result.content[0].text
    var txt=((((j||{}).result||{}).content||[])[0]||{}).text||"";
    var valid=false; try{ valid=JSON.parse(txt).valid===true; }catch(_){ valid=/\\?"valid\\?":\s*true/.test(txt); }
    b.textContent=valid?"valid ✓ — signature matches":"invalid ✗ — receipt altered";
    b.style.color=valid?"var(--ok)":"var(--flag)";
  }catch(e){ b.textContent="check unavailable"; }
});

/* ---- network self-check (a VPN here will flag the driver) ---- */
(async function(){
  try{
    var r=await fetch(API+"/whereami",{cache:"no-store"}); var w=await r.json();
    var d=$("net").querySelector(".d"), txt=$("netTxt");
    if(w.proxy||w.hosting){ d.style.background="var(--flag)"; txt.textContent="network flagged — a proxy/VPN here would fail the ledger"; }
    else if(w.ok){ d.style.background="var(--ok)"; txt.textContent="network clear · "+(w.country||"located"); }
    else{ d.style.background="var(--wait)"; txt.textContent="network not geolocatable (local)"; }
  }catch(e){}
})();

/* resume an in-flight order on refresh */
if(orderId) enterTimeline();
})();
</script>
</body>
</html>
