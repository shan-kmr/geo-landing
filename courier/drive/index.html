<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>janus — driver</title>
<!-- drive: the driver simulator. Auto-walks to the dropoff, streaming pings to
     /courier/verify. Drag the dot to teleport (the engine flags it). Arrived /
     Complete are ALWAYS clickable — the app never blocks; the ledger records
     the truth. API base: ?api=… (defaults to the live Fly server). -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --paper:#F6F4EF;--ink:#1A1815;--ink2:#4E4B45;--muted:#8C887E;--faint:#B4B0A4;
  --hair:#E0DDD4;--surface:#FFFFFF;--surface2:#F0EDE6;
  --accent:#1E3A8A;--accent-soft:rgba(30,58,138,.10);--ok:#1A7D4A;--ok-soft:rgba(26,125,74,.12);
  --flag:#CC2B1D;--wait:#B0771A;--mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:-apple-system,system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#141210;--ink:#F2EFE8;--ink2:#C4BFB4;--muted:#8E897E;--faint:#5E5A51;--hair:#2C2921;
  --surface:#1C1A16;--surface2:#211E19;--accent:#7E9EDC;--accent-soft:rgba(126,158,220,.15);
  --ok:#5FB98A;--ok-soft:rgba(95,185,138,.16);--flag:#E2685A;--wait:#D2A24C;
}}
:root[data-theme="dark"]{--paper:#141210;--ink:#F2EFE8;--ink2:#C4BFB4;--muted:#8E897E;--faint:#5E5A51;--hair:#2C2921;--surface:#1C1A16;--surface2:#211E19;--accent:#7E9EDC;--accent-soft:rgba(126,158,220,.15);--ok:#5FB98A;--ok-soft:rgba(95,185,138,.16);--flag:#E2685A;--wait:#D2A24C;}
:root[data-theme="light"]{--paper:#F6F4EF;--ink:#1A1815;--ink2:#4E4B45;--muted:#8C887E;--faint:#B4B0A4;--hair:#E0DDD4;--surface:#FFFFFF;--surface2:#F0EDE6;--accent:#1E3A8A;--accent-soft:rgba(30,58,138,.10);--ok:#1A7D4A;--ok-soft:rgba(26,125,74,.12);--flag:#CC2B1D;--wait:#B0771A;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#map{position:absolute;inset:34px 0 0 0}
.panel{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--hair);border-radius:12px;box-shadow:0 10px 34px rgba(22,24,26,.12)}
.top{top:48px;left:14px;right:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;max-width:520px}
.eyebrow{font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.top .who{font:600 13px/1.2 var(--sans)} .top .who small{color:var(--muted);font-weight:500}
.top .dist{margin-left:auto;font:600 15px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.top .dist small{font-size:11px;color:var(--muted);font-weight:500}
.dock{bottom:16px;left:14px;right:14px;padding:13px 14px;max-width:520px;margin:0 auto}
.status{font:500 12.5px/1.45 var(--sans);color:var(--muted);margin-bottom:11px;min-height:18px}
.status b{color:var(--ink);font-weight:600}
.verdict{display:inline-flex;align-items:center;gap:7px;font:600 11px/1 var(--mono);letter-spacing:.06em;
  border:1px solid var(--hair);border-radius:5px;padding:6px 9px;color:var(--muted);margin-bottom:11px;opacity:0;transition:opacity .4s}
.verdict.show{opacity:1} .verdict.ok{border-color:var(--ok);color:var(--ok)} .verdict.bad{border-color:var(--flag);color:var(--flag)}
.acts{display:flex;gap:9px}
.act{flex:1;font:600 13.5px/1 var(--sans);border:1px solid var(--hair);background:var(--surface2);color:var(--ink2);
  border-radius:9px;padding:13px 0;cursor:pointer;transition:all .3s;position:relative}
.act .sub{display:block;font:500 10px/1.3 var(--mono);color:var(--muted);margin-top:3px;letter-spacing:.03em}
.act.near{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.act.near .sub{color:var(--ok)}
.act.go{border-color:var(--accent);background:var(--accent);color:#fff} .act.go .sub{color:rgba(255,255,255,.8)}
.tools{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.tbtn{font:500 11px/1 var(--mono);border:1px solid var(--hair);background:var(--surface);color:var(--ink2);border-radius:6px;padding:7px 9px;cursor:pointer}
.tbtn:hover{border-color:var(--muted)}
.hint{font:italic 11px/1.4 var(--sans);color:var(--faint);margin-left:auto}
/* markers */
.drv{width:34px;height:34px;position:relative;cursor:grab}
.drv .halo{position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:.16}
.drv .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.drv.bad .halo{background:var(--flag)} .drv.bad .dot{background:var(--flag)}
.tgt{width:26px;height:26px}
.tgt .ring{width:26px;height:26px;border:3px solid var(--ok);border-radius:50%;background:rgba(26,125,74,.10);box-sizing:border-box}
.tgt .ring.pulse{animation:pp .8s ease-out}
@keyframes pp{0%{box-shadow:0 0 0 0 var(--ok-soft)}100%{box-shadow:0 0 0 16px transparent}}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel top">
  <div><div class="eyebrow">janus · courier app</div><div class="who">Driver <small id="who">…</small></div></div>
  <div class="dist"><span id="distN">—</span> <small>m to door</small></div>
</div>
<div class="panel dock">
  <div class="status" id="status">Connecting…</div>
  <div class="verdict" id="verdict"></div>
  <div class="acts">
    <button class="act" id="arrive">Arrived<span class="sub" id="arriveSub">—</span></button>
    <button class="act" id="deliver">Complete delivery<span class="sub" id="deliverSub">—</span></button>
  </div>
  <div class="tools">
    <button class="tbtn" id="start">Start driving</button>
    <button class="tbtn" id="teleport">Fake arrival (spoof)</button>
    <span class="hint">the app never blocks you · the ledger records the truth</span>
  </div>
</div>

<script>
(function(){
"use strict";
var f01=function(t,a,b){return Math.max(0,Math.min(1,(t-a)/(b-a)))};
var eO=function(x){return 1-Math.pow(1-x,3)};
var lerp=function(a,b,k){return a+(b-a)*k};
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var $=function(id){return document.getElementById(id)};
var Q=new URLSearchParams(location.search);
var API=(Q.get("api")||"https://janus-courier.fly.dev/courier").replace(/\/$/,"");
// stable id across tab re-opens (?fresh forces a new one) — stops the ledger piling up ws-XXXX dots
var RADIUS=80, id=(!Q.has("fresh")&&localStorage.getItem("janus-drv"))||("ws-"+Math.random().toString(36).slice(2,6));
try{localStorage.setItem("janus-drv",id);}catch(e){}
var SPEED=14, SPAWN_M=200;                 // ~50 km/h drive; spawn ~200 m out (arrives in ~15s)
$("who").textContent=id;

function hav(a,b,c,d){var R=6371000,p=Math.PI/180,dphi=(c-a)*p,dl=(d-b)*p,x=Math.sin(dphi/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));}

var map=new maplibregl.Map({container:"map",attributionControl:false,
  style:{version:8,sources:{c:{type:"raster",tiles:["https://a.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png"],tileSize:256}},layers:[{id:"c",type:"raster",source:"c"}]},
  center:[-73.996,40.7246],zoom:15});

var dropoff=null, sim=null, driverMk=null, tgtMk=null, lineSrc="nav";
var driving=false, dragging=false, lastVerdict=null, distShown=0;

/* markers */
function driverEl(){var e=document.createElement("div");e.className="drv";e.innerHTML='<div class="halo"></div><div class="dot"></div>';return e;}
function tgtEl(){var e=document.createElement("div");e.className="tgt";e.innerHTML='<div class="ring" id="tgtRing"></div>';return e;}

async function boot(){
  // register -> get the job (the buyer's dropoff, if an order is waiting)
  try{
    var r=await fetch(API+"/register",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({driver_id:id,name:id})});
    var d=await r.json(); dropoff={lat:d.job.dropoff[0],lng:d.job.dropoff[1]}; RADIUS=d.job.radius_m||80;
  }catch(e){ $("status").textContent="couldn't reach the server"; return; }
  // spawn ~SPAWN_M SW of the dropoff (keeps claimed GPS near the demo IP, any city)
  var dLat=SPAWN_M/111320, dLng=SPAWN_M/(111320*Math.cos(dropoff.lat*Math.PI/180));
  sim={lat:dropoff.lat-dLat*0.75, lng:dropoff.lng-dLng*0.66};
  tgtMk=new maplibregl.Marker({element:tgtEl(),anchor:"center"}).setLngLat([dropoff.lng,dropoff.lat]).addTo(map);
  driverMk=new maplibregl.Marker({element:driverEl(),anchor:"center",draggable:true}).setLngLat([sim.lng,sim.lat]).addTo(map);
  driverMk.on("dragstart",function(){dragging=true;});
  driverMk.on("dragend",function(){var ll=driverMk.getLngLat();sim={lat:ll.lat,lng:ll.lng};dragging=false;ping();}); // teleport
  // the nav line + fit need the style loaded, or addSource throws and aborts boot
  function withStyle(fn){ if(map.isStyleLoaded()) fn(); else map.once("load",fn); }
  withStyle(function(){
    if(!map.getSource(lineSrc)){
      map.addSource(lineSrc,{type:"geojson",data:navGeo()});
      map.addLayer({id:"nav",type:"line",source:lineSrc,paint:{"line-color":"#8C887E","line-width":1.5,"line-dasharray":[2,2],"line-opacity":.6}});
    }
    map.fitBounds([[Math.min(sim.lng,dropoff.lng),Math.min(sim.lat,dropoff.lat)],[Math.max(sim.lng,dropoff.lng),Math.max(sim.lat,dropoff.lat)]],{padding:100,duration:0});
  });
  $("status").innerHTML="Job: <b>deliver to the pin</b>. Press <b>Start driving</b> — or drag your dot to spoof.";
  ping(); loop();
}
function navGeo(){return {type:"Feature",geometry:{type:"LineString",coordinates:sim&&dropoff?[[sim.lng,sim.lat],[dropoff.lng,dropoff.lat]]:[]}};}

function dist(){ return sim&&dropoff?hav(sim.lat,sim.lng,dropoff.lat,dropoff.lng):0; }

/* smooth per-frame render (the dot glides; distance eases) */
var inside=false;
function loop(){
  requestAnimationFrame(loop);
  if(!sim) return;
  if(driving&&!dragging){
    var d=dist();
    if(d>2){ var frac=Math.min(1,(SPEED/60)/d);   // move SPEED metres/sec at 60fps
      sim.lat=lerp(sim.lat,dropoff.lat,frac);
      sim.lng=lerp(sim.lng,dropoff.lng,frac);
    }
  }
  if(driverMk&&!dragging) driverMk.setLngLat([sim.lng,sim.lat]);
  map.getSource(lineSrc)&&map.getSource(lineSrc).setData(navGeo());
  var dd=Math.round(dist());
  distShown=reduce?dd:lerp(distShown,dd,0.25);
  $("distN").textContent=Math.round(distShown);
  // geofence styling — actions always clickable, only the look changes
  var wasInside=inside; inside=dist()<=RADIUS;
  if(inside&&!wasInside){ var rg=$("tgtRing"); if(rg){rg.classList.remove("pulse");void rg.offsetWidth;rg.classList.add("pulse");} }
  var arr=$("arrive"), del=$("deliver");
  arr.classList.toggle("near",inside); del.classList.toggle("go",inside);
  $("arriveSub").textContent = inside?"at the door":Math.round(dist())+" m out";
  $("deliverSub").textContent = inside?"at the door":Math.round(dist())+" m out";
}

/* pings + claims */
async function post(action){
  if(!sim) return null;
  try{
    var r=await fetch(API+"/verify",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({driver_id:id,lat:sim.lat,lng:sim.lng,action:action,demo:true})});
    return await r.json();
  }catch(e){ return null; }
}
var claimHold=0;
function ping(){ post("ping").then(function(res){ if(res) applyVerdict(res,true); }); }
// the server is the source of truth for the dropoff: a late-binding order or a
// dispatcher move can change it after we registered, so poll it (like the phone app)
async function pollJob(){
  try{
    var j=await (await fetch(API+"/driver/"+id,{cache:"no-store"})).json();
    if(j&&j.dropoff&&(!dropoff||Math.abs(j.dropoff[0]-dropoff.lat)>1e-6||Math.abs(j.dropoff[1]-dropoff.lng)>1e-6)){
      dropoff={lat:j.dropoff[0],lng:j.dropoff[1]}; RADIUS=j.radius_m||RADIUS;
      if(tgtMk) tgtMk.setLngLat([dropoff.lng,dropoff.lat]);
      if(map.getSource(lineSrc)) map.getSource(lineSrc).setData(navGeo());
      $("status").innerHTML="Dropoff set — <b>"+Math.round(dist())+" m</b> away. Press <b>Start driving</b>.";
    }
  }catch(e){}
}
function applyVerdict(res,quiet){
  if(quiet && performance.now()<claimHold) return;   // a fresh claim verdict holds; pings don't stomp it
  lastVerdict=res;
  var el=$("verdict"), bad=res.verdict==="FLAGGED";
  el.className="verdict show"+(bad?" bad":res.verdict==="VERIFIED"?" ok":"");
  el.textContent=(bad?"✗ "+res.code:res.verdict==="VERIFIED"?"✓ verified":"• "+res.code)+" · "+(res.score!=null?res.score:"—");
  if(driverMk) driverMk.getElement().classList.toggle("bad",bad);
  if(!quiet) $("status").innerHTML=res.reason;
}
$("start").addEventListener("click",function(){ driving=!driving; this.textContent=driving?"Pause":"Start driving";
  $("status").innerHTML=driving?"Driving to the door…":"Paused."; });
$("teleport").addEventListener("click",function(){ // fake arrival: jump straight to the dropoff
  if(!dropoff) return; sim={lat:dropoff.lat,lng:dropoff.lng}; driving=false; $("start").textContent="Start driving";
  driverMk.setLngLat([sim.lng,sim.lat]); map.easeTo({center:[sim.lng,sim.lat],zoom:16,duration:600}); ping();
  $("status").innerHTML="Jumped straight to the door — a <b>faked arrival</b>. The ledger flags the impossible jump.";
});
$("arrive").addEventListener("click",function(){ claimHold=performance.now()+5000; post("arrived").then(function(r){ if(r){applyVerdict(r);
  $("status").innerHTML="Reported <b>arrival</b> — "+(r.trusted&&r.dist_dropoff_m<=RADIUS?"verified.":"the ledger shows you "+Math.round(r.dist_dropoff_m)+" m out."); } }); });
$("deliver").addEventListener("click",function(){ claimHold=performance.now()+5000; post("deliver").then(function(r){ if(r){applyVerdict(r);
  $("status").innerHTML=(r.verdict==="VERIFIED")?"<b>Delivered · verified.</b> A signed receipt was minted.":"Marked <b>delivered</b> — recorded as unverified ("+Math.round(r.dist_dropoff_m)+" m).";
  map.easeTo({center:[dropoff.lng,dropoff.lat],zoom:16,duration:600}); } }); });

// stream real pings + keep the dropoff in sync with the server every 2s
setInterval(function(){ pollJob(); if(sim&&!dragging) ping(); },2000);
boot();
})();
</script>
<script>/* demo surface switcher — the other three surfaces each open in a new tab */(function(){
var here=(location.pathname.match(/\/(chat|control|drive|order)\//)||[])[1]||"chat";
var s=document.createElement("style");
s.textContent='.demobar{position:fixed;top:0;left:0;right:0;height:34px;z-index:9000;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--surface2);border-bottom:1px solid var(--hair);font-family:var(--mono)}'
+'.demobar a{text-decoration:none}.demobar .b{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}'
+'.demobar nav{margin-left:auto;display:flex;gap:6px}.demobar nav a{font:600 10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--hair);border-radius:99px;padding:5px 10px;background:var(--surface)}'
+'.demobar nav a:hover{border-color:var(--accent);color:var(--accent)}.demobar nav a.on{background:var(--accent);color:#fff;border-color:var(--accent)}';
document.head.appendChild(s);
var b=document.createElement("div");b.className="demobar";
var L=[["chat","customer"],["control","dispatch"],["drive","driver"],["order","buyer"]];
b.innerHTML='<a class="b" href="../chat/'+location.search+'">◆ janus · delivery demo</a><nav>'+L.map(function(x){return '<a href="../'+x[0]+'/'+location.search+'"'+(x[0]===here?' class="on"':' target="_blank"')+'>'+x[1]+'</a>'}).join('')+'</nav>';
document.body.insertBefore(b,document.body.firstChild);
var api=(new URLSearchParams(location.search).get("api")||"https://janus-courier.fly.dev/courier").replace(/\/$/,"");
var rb=document.createElement("a");rb.textContent="⟲ clear";rb.href="#";  // wipe every screen
rb.style.cssText="margin-left:8px;font:600 10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:#CC2B1D;border:1px solid #CC2B1D;border-radius:99px;padding:5px 10px;cursor:pointer;text-decoration:none";
rb.onclick=function(e){e.preventDefault();rb.textContent="clearing…";try{localStorage.removeItem("janus-drv");localStorage.removeItem("janus_order");}catch(_){}fetch(api+"/reset",{method:"POST"}).catch(function(){}).finally(function(){location.reload();});};
b.querySelector("nav").appendChild(rb);
var _t0=Date.now(),_vid=null;  // pageview + dwell beacon (time-on-page reported on exit)
fetch(api+"/px?p="+here,{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){_vid=d&&d.vid;}).catch(function(){});
function _dwell(){if(_vid==null)return;try{navigator.sendBeacon(api+"/dwell",new Blob([JSON.stringify({vid:_vid,s:(Date.now()-_t0)/1000})],{type:"application/json"}));}catch(e){}}
addEventListener("pagehide",_dwell);addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")_dwell();});
})();</script>
</body>
</html>
