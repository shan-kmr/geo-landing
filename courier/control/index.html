<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>janus — control</title>
<!-- control: the dispatcher's map + the append-only ledger. Left: live driver
     dots and the dropoff. Right: every app action as it happens, verdicts and
     receipts included. Click the map to move the delivery. API: ?api=… -->
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --paper:#F6F4EF;--ink:#1A1815;--ink2:#4E4B45;--muted:#8C887E;--faint:#B4B0A4;--hair:#E0DDD4;
  --surface:#FFFFFF;--surface2:#F0EDE6;--accent:#1E3A8A;--accent-soft:rgba(30,58,138,.08);
  --ok:#1A7D4A;--flag:#CC2B1D;--wait:#B0771A;--mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:-apple-system,system-ui,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#141210;--ink:#F2EFE8;--ink2:#C4BFB4;--muted:#8E897E;--faint:#5E5A51;--hair:#2C2921;
  --surface:#1C1A16;--surface2:#211E19;--accent:#7E9EDC;--accent-soft:rgba(126,158,220,.12);--ok:#5FB98A;--flag:#E2685A;--wait:#D2A24C;
}}
:root[data-theme="dark"]{--paper:#141210;--ink:#F2EFE8;--ink2:#C4BFB4;--muted:#8E897E;--faint:#5E5A51;--hair:#2C2921;--surface:#1C1A16;--surface2:#211E19;--accent:#7E9EDC;--accent-soft:rgba(126,158,220,.12);--ok:#5FB98A;--flag:#E2685A;--wait:#D2A24C;}
:root[data-theme="light"]{--paper:#F6F4EF;--ink:#1A1815;--ink2:#4E4B45;--muted:#8C887E;--faint:#B4B0A4;--hair:#E0DDD4;--surface:#FFFFFF;--surface2:#F0EDE6;--accent:#1E3A8A;--accent-soft:rgba(30,58,138,.08);--ok:#1A7D4A;--flag:#CC2B1D;--wait:#B0771A;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:1fr 380px;height:100vh}
@media (max-width:800px){.wrap{grid-template-columns:1fr;grid-template-rows:1fr 45vh}}
#map{position:relative}
.head{position:absolute;z-index:5;top:14px;left:14px;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:11px 14px;box-shadow:0 8px 26px rgba(22,24,26,.10);max-width:300px}
.head .eyebrow{font:600 10px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.head h1{font:600 15px/1.3 var(--sans);margin:5px 0 2px;letter-spacing:-.01em}
.head p{font:12px/1.4 var(--sans);color:var(--muted);margin:0}
/* ledger */
.ledger{border-left:1px solid var(--hair);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.ledger .lh{padding:13px 15px 11px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:8px}
.ledger .lh .live{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.ledger .lh b{font:600 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.ledger .lh .cnt{margin-left:auto;font:500 11px/1 var(--mono);color:var(--muted)}
.log{flex:1;overflow-y:auto;padding:8px 0;min-height:0}
@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ev{display:grid;grid-template-columns:52px 1fr;gap:9px;padding:5px 15px 5px 13px;border-left:2px solid transparent;animation:riseIn .45s ease both}
.ev .t{font:500 10.5px/1.5 var(--mono);color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.ev .m{font:12.5px/1.45 var(--sans);color:var(--ink2);word-break:break-word}
.ev .tag{display:inline-block;font:600 8.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--hair);border-radius:3px;padding:2px 4px;margin-right:6px;vertical-align:1px}
.ev.ok{border-left-color:var(--ok)} .ev.ok .tag{color:var(--ok);border-color:var(--ok)}
.ev.bad{border-left-color:var(--flag);background:var(--accent-soft)} .ev.bad .tag{color:var(--flag);border-color:var(--flag)} .ev.bad .m{color:var(--ink)}
.ev.act{border-left-color:var(--accent)} .ev.act .tag{color:var(--accent);border-color:var(--accent)}
.empty{padding:24px 16px;font:13px/1.5 var(--sans);color:var(--muted);text-align:center}
/* escalated disputes (from the chat) — the agent rules here */
#disputes:empty{display:none}
.dcard{margin:10px 12px;border:1.5px solid var(--flag);border-radius:10px;background:var(--surface2);overflow:hidden;animation:riseIn .4s ease both}
.dcard .dh{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--flag);padding:11px 13px 0}
.dcard .da{font:600 13.5px/1.3 var(--sans);padding:5px 13px 2px}
.dcard .dm{font:12px/1.5 var(--sans);color:var(--ink2);padding:2px 13px 9px} .dcard .dm b{color:var(--ink)}
.dcard .de{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font:500 11.5px/1.6 var(--mono);padding:0 13px 11px}
.dcard .de .bad{color:var(--flag)} .dcard .de .good{color:var(--ok)}
.dcard .dacts{display:flex;gap:8px;padding:0 13px 12px}
.dcard .db{flex:1;font:600 12px/1 var(--sans);border-radius:8px;padding:11px 0;cursor:pointer;border:1px solid var(--hair)}
.dcard .db.refund{background:var(--flag);color:#fff;border-color:var(--flag)} .dcard .db.uphold{background:var(--surface);color:var(--ink2)}
.dcard .done{padding:2px 13px 13px;font:600 12px/1.4 var(--sans);color:var(--ok)} .dcard .done.up{color:var(--muted)}
/* markers */
.drv{width:34px;height:34px;position:relative;pointer-events:none}
.drv .halo{position:absolute;inset:0;border-radius:50%;background:var(--ok);opacity:.16}
.drv .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:17px;height:17px;border-radius:50%;background:var(--ok);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.drv .lbl{position:absolute;top:34px;left:50%;transform:translateX(-50%);font:600 9px/1 var(--mono);color:var(--ink);background:var(--surface);border-radius:4px;padding:2px 5px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tgt{width:26px;height:26px;pointer-events:none}
.tgt .ring{width:26px;height:26px;border:3px solid var(--accent);border-radius:50%;background:var(--accent-soft);box-sizing:border-box}
.tgt .lbl{position:absolute;top:28px;left:50%;transform:translateX(-50%);font:600 8.5px/1 var(--mono);letter-spacing:.08em;color:var(--accent);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div id="map">
    <div class="head">
      <div class="eyebrow">janus · control</div>
      <h1>Dispatch</h1>
      <p>Click the map to move the delivery. The ledger records every action as it happens.</p>
    </div>
  </div>
  <div class="ledger">
    <div class="lh"><span class="live" id="live"></span><b>ledger</b><span class="cnt" id="cnt">—</span></div>
    <div id="disputes"></div>
    <div class="log" id="log"><div class="empty" id="empty">Waiting for activity… open the order and driver pages.</div></div>
  </div>
</div>

<script>
(function(){
"use strict";
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
var $=function(id){return document.getElementById(id)};
var lerp=function(a,b,k){return a+(b-a)*k};
var Q=new URLSearchParams(location.search);
var API=(Q.get("api")||"https://janus-courier.fly.dev/courier").replace(/\/$/,"");

var map=new maplibregl.Map({container:"map",attributionControl:false,
  style:{version:8,sources:{c:{type:"raster",tiles:["https://a.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}.png"],tileSize:256}},layers:[{id:"c",type:"raster",source:"c"}]},
  center:[-73.996,40.7246],zoom:14});

map.on("click",function(e){
  fetch(API+"/job",{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({dropoff:[+e.lngLat.lat.toFixed(6),+e.lngLat.lng.toFixed(6)],label:"moved here"})}).catch(function(){});
});

/* ---- markers (glide between polls) ---- */
var drivers={}, tgt=null;
function drvEl(){var e=document.createElement("div");e.className="drv";e.innerHTML='<div class="halo"></div><div class="dot"></div><div class="lbl"></div>';return e;}
function tgtEl(){var e=document.createElement("div");e.className="tgt";e.innerHTML='<div class="ring"></div><div class="lbl">DROPOFF</div>';return e;}
function color(v){return v==="FLAGGED"?"var(--flag)":v==="PENDING"?"var(--wait)":"var(--ok)";}

var want={}; // driver_id -> target lnglat for smooth glide
function renderState(cs){
  var have={}, dp=null;
  cs.forEach(function(c){
    if(c.dropoff) dp=c.dropoff;
    if(!c.pos) return; have[c.driver_id]=1;
    var col=color(c.verdict);
    if(!drivers[c.driver_id]){ drivers[c.driver_id]=new maplibregl.Marker({element:drvEl(),anchor:"center"}).setLngLat([c.pos[1],c.pos[0]]).addTo(map); want[c.driver_id]=[c.pos[1],c.pos[0]]; }
    want[c.driver_id]=[c.pos[1],c.pos[0]];
    var el=drivers[c.driver_id].getElement();
    el.querySelector(".dot").style.background=col; el.querySelector(".halo").style.background=col;
    el.querySelector(".lbl").textContent=c.name||c.driver_id;
  });
  Object.keys(drivers).forEach(function(k){ if(!have[k]){ drivers[k].remove(); delete drivers[k]; delete want[k]; } });
  if(dp){ if(!tgt) tgt=new maplibregl.Marker({element:tgtEl(),anchor:"center"}).setLngLat([dp[1],dp[0]]).addTo(map); else tgt.setLngLat([dp[1],dp[0]]); }
}
function glide(){ requestAnimationFrame(glide);
  Object.keys(want).forEach(function(k){ var m=drivers[k]; if(!m) return; var cur=m.getLngLat(), t=want[k];
    m.setLngLat([reduce?t[0]:lerp(cur.lng,t[0],0.2), reduce?t[1]:lerp(cur.lat,t[1],0.2)]); }); }
glide();

/* ---- the ledger ---- */
var TAGS={ "driver.registered":["driver",""],"order.created":["order","act"],"order.bound":["order","act"],
  "order.status":["stage","act"],"job.moved":["dispatch","act"],"ping":["ping",""],
  "geofence.entered":["geofence","act"],"geofence.exited":["geofence",""],
  "verdict.flagged":["flag","bad"],"verdict.cleared":["cleared","ok"],
  "claim":["claim",""],"receipt.issued":["receipt","ok"] };
function sev(e){
  if(e.type==="verdict.flagged") return "bad";
  if(e.type==="claim") return e.data&&e.data.verified?"ok":"bad";
  if(e.type==="receipt.issued"||e.type==="verdict.cleared") return "ok";
  var m=TAGS[e.type]; return m?m[1]:"";
}
function hhmm(ts){var d=new Date(ts*1000);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);}
var cursor=0, count=0, log=$("log");
function pushEvents(evs){
  if(!evs.length) return;
  if($("empty")) $("empty").remove();
  var atBottom=log.scrollTop+log.clientHeight>=log.scrollHeight-40;
  evs.forEach(function(e){
    cursor=Math.max(cursor,e.seq); count++;
    var tag=(TAGS[e.type]||[e.type.split(".")[0]])[0], s=sev(e);
    var row=document.createElement("div"); row.className="ev"+(s?" "+s:"");
    row.innerHTML='<span class="t">'+hhmm(e.ts)+'</span><span class="m"><span class="tag">'+tag+'</span>'+e.msg+'</span>';
    log.appendChild(row);   // CSS riseIn animates the entrance (survives a backgrounded tab)
  });
  $("cnt").textContent=count+" events";
  if(atBottom||reduce) log.scrollTop=log.scrollHeight;
}

/* ---- escalated disputes: the chat opens them, the agent rules here ---- */
var resolvedIds={};
function renderDisputes(list){
  var box=$("disputes"), open=(list||[]).filter(function(d){return d.status==="open";});
  var ids=open.map(function(d){return d.dispute_id});
  [].slice.call(box.children).forEach(function(c){ if(ids.indexOf(c.dataset.id)<0 && !resolvedIds[c.dataset.id]) c.remove(); });
  open.forEach(function(d){
    if(box.querySelector('[data-id="'+d.dispute_id+'"]')) return;
    var flagged=!d.verified;
    var checks=d.checks?Object.keys(d.checks).map(function(k){return '<span class="'+(d.checks[k]==="fail"?"bad":"good")+'">'+k[0]+':'+(d.checks[k]==="fail"?"✗":"✓")+'</span>'}).join(" "):"—";
    var c=document.createElement("div"); c.className="dcard"; c.dataset.id=d.dispute_id;
    c.innerHTML='<div class="dh">⚠ delivery dispute · '+d.dispute_id+'</div>'
      +'<div class="da">'+(d.address||("order "+d.order_id))+'</div>'
      +'<div class="dm">Courier claims <b>delivered</b>. Janus verdict: <b style="color:var(--flag)">'+(d.code||"—")+'</b> — the trail conflicts with the claim.</div>'
      +'<div class="de"><span>distance to door</span><span class="'+(flagged?"bad":"good")+'">'+Math.round(d.dist_m||0)+' m</span>'
      +'<span>device checks</span><span>'+checks+'</span>'
      +'<span>score</span><span class="'+(flagged?"bad":"good")+'">'+(d.score!=null?d.score:"—")+'</span></div>'
      +'<div class="dacts"><button class="db uphold">Uphold delivery</button><button class="db refund">Confirm not delivered · refund</button></div>';
    c.querySelector(".uphold").onclick=function(){resolveDispute(d.dispute_id,"uphold",c)};
    c.querySelector(".refund").onclick=function(){resolveDispute(d.dispute_id,"refund",c)};
    box.appendChild(c);
  });
}
async function resolveDispute(id,decision,card){
  resolvedIds[id]=1;
  card.querySelector(".dacts").outerHTML='<div class="done'+(decision==="uphold"?" up":"")+'">'+(decision==="refund"?"✓ Refunded · courier flagged — sent back to the customer":"Delivery upheld — no refund")+'</div>';
  try{ await fetch(API+"/dispute/"+id+"/resolve",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({decision:decision})}); }catch(e){}
  setTimeout(function(){card.remove()},4500);
}
async function poll(){
  try{
    var s=await (await fetch(API+"/state",{cache:"no-store"})).json(); renderState(s.couriers);
    var ev=await (await fetch(API+"/events?since="+cursor,{cache:"no-store"})).json(); pushEvents(ev.events);
    var dz=await (await fetch(API+"/disputes",{cache:"no-store"})).json(); renderDisputes(dz.disputes);
    $("live").style.background="var(--ok)";
  }catch(e){ $("live").style.background="var(--flag)"; }
  setTimeout(poll,1500);
}
poll();
})();
</script>
</body>
</html>
